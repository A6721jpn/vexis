<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">VEXIS demo video card</title>
  <desc id="desc">A custom README card that clearly indicates a clickable VEXIS workflow demo video on YouTube.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08131d"/>
      <stop offset="55%" stop-color="#0f2230"/>
      <stop offset="100%" stop-color="#18394b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#112734"/>
      <stop offset="100%" stop-color="#0a1822"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#31d0c6"/>
      <stop offset="100%" stop-color="#7bf2d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#021018" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1080" cy="140" r="220" fill="#123448" opacity="0.34"/>
  <circle cx="184" cy="620" r="180" fill="#0e3142" opacity="0.34"/>
  <rect x="54" y="58" width="1172" height="604" rx="34" fill="#08131d" opacity="0.58" stroke="#2f5363" stroke-opacity="0.44"/>

  <g filter="url(#shadow)">
    <rect x="96" y="122" width="500" height="356" rx="24" fill="url(#panel)" stroke="#3d6676" stroke-opacity="0.62"/>
    <rect x="96" y="122" width="500" height="44" rx="24" fill="#163847"/>
    <circle cx="130" cy="144" r="8" fill="#ff6767"/>
    <circle cx="156" cy="144" r="8" fill="#ffd166"/>
    <circle cx="182" cy="144" r="8" fill="#45d483"/>
    <text x="214" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#c8e8f2">VEXIS Workflow Demo</text>

    <rect x="126" y="190" width="138" height="112" rx="16" fill="#0f3141" stroke="#2c596a"/>
    <text x="150" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#dffaff">STEP</text>
    <text x="150" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#8ec9da">Place files in</text>
    <text x="150" y="286" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#7bf2d9">input/</text>

    <rect x="278" y="190" width="138" height="112" rx="16" fill="#103445" stroke="#2c596a"/>
    <text x="304" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#dffaff">Gen Mesh</text>
    <text x="304" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#8ec9da">Preview the</text>
    <text x="304" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#8ec9da">generated mesh</text>

    <rect x="430" y="190" width="136" height="112" rx="16" fill="#103a45" stroke="#2c596a"/>
    <text x="454" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#dffaff">3D Results</text>
    <text x="454" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#8ec9da">Review contour</text>
    <text x="454" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#8ec9da">and graph output</text>

    <rect x="126" y="326" width="440" height="114" rx="18" fill="#0b202d" stroke="#2c596a"/>
    <rect x="148" y="350" width="144" height="12" rx="6" fill="url(#accent)"/>
    <rect x="148" y="376" width="318" height="10" rx="5" fill="#1b4456"/>
    <rect x="148" y="399" width="386" height="10" rx="5" fill="#1b4456"/>
    <rect x="148" y="422" width="274" height="10" rx="5" fill="#1b4456"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="122" width="546" height="476" rx="30" fill="#f5fbff" fill-opacity="0.96"/>
    <rect x="678" y="154" width="132" height="40" rx="20" fill="#ff3b30"/>
    <polygon points="698,174 698,186 710,180" fill="#ffffff"/>
    <text x="724" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">YOUTUBE</text>

    <text x="678" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" fill="#0c1720">WATCH DEMO VIDEO</text>
    <text x="678" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#1f5663">VEXIS Workflow Walkthrough</text>
    <text x="678" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#43616d">See the actual VEXIS flow from STEP import to</text>
    <text x="678" y="407" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#43616d">mesh generation, FEBio solve, graph output,</text>
    <text x="678" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#43616d">and interactive 3D contour review.</text>

    <rect x="678" y="486" width="470" height="72" rx="22" fill="#0b2230"/>
    <text x="714" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#e7fbff">Click this card to open the video</text>

    <circle cx="1108" cy="198" r="72" fill="#ff3b30"/>
    <circle cx="1108" cy="198" r="64" fill="#ff5348"/>
    <polygon points="1088,166 1088,230 1144,198" fill="#ffffff"/>
  </g>

  <g opacity="0.95">
    <rect x="100" y="598" width="286" height="38" rx="19" fill="#163847"/>
    <text x="124" y="623" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#dffaff">VIDEO LINK: VEXIS HOW-TO DEMO</text>
  </g>
</svg>
