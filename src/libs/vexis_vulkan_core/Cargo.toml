[dependencies]
pyo3 = { version = "0.22.0", features = ["extension-module"] }
numpy = "0.22.0"
memmap2 = "0.9.0"
vulkano = "0.34.0"
byteorder = "1.5.0"
log = "0.4.20"
env_logger = "0.11.0"
