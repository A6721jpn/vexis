[package]
name = "vexis_vulkan_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "vexis_vulkan_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22.0", features = ["extension-module"] }
numpy = "0.22.0"
memmap2 = "0.9.0"
vulkano = "0.34.0"
# vulkano-shaders = "0.34.0" (requires cmake/shaderc)
byteorder = "1.5.0"
log = "0.4.20"
env_logger = "0.11.0"
bytemuck = { version = "1.16.0", features = ["derive"] }
naga = { version = "0.14", features = ["glsl-in", "spv-out"] }
